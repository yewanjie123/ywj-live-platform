spring:
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        register-enabled: false
        server-addr: 192.168.79.163:8848
        namespace: ywj-live-project
      config:
        import-check:
          enabled: false
        # 当前服务启动后去nacos中读取配置文件的后缀
        file-extension: yaml
        # 读取配置的nacos地址
        server-addr: 192.168.79.163:8848
        # 读取配置的nacos的名空间
        namespace: ywj-live-project
  config:
    import:
      - optional:nacos:ywj-live-account-provider.yaml?group=DEFAULT_GROUP

dubbo:
  startup:
    delay: 5000
  # 新增迁移内容开始
  application:
    name: ${spring.application.name}
  lifecycle:
    keep-alive: true
  registry:
    address: nacos://192.168.79.163:8848?namespace=ywj-live-project&username=nacos&password=nacos&timeout=5000&group=DEFAULT_GROUP
  protocol:
    name: dubbo
    port: 9003
    dubbo:
      threadpool: fixed
      dispatcher: execution
      threads: 500
      accepts: 500
  # 原有已配置保留
