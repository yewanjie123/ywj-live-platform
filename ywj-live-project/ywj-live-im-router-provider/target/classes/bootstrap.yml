spring:
  application:
    name: ywj-live-im-router-provider
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        register-enabled: false
        server-addr: 192.168.79.163:8848
        namespace: ywj-live-project
      config:
        import-check:
          enabled: false
        file-extension: yaml
        server-addr: 192.168.79.163:8848
        namespace: ywj-live-project
config:
  import:
    - optional:nacos:ywj-live-im-router-provider.yaml?group=DEFAULT_GROUP
