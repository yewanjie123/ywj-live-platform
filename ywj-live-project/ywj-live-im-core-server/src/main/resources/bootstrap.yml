spring:
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: 192.168.79.163:8848
        namespace: ywj-live-project
      config:
        import-check:
          enabled: false
        # 当前服务启动后去nacos中读取配置文件的后缀
        file-extension: yaml
        # 读取配置的nacos地址
        server-addr: 192.168.79.163:8848
        # 读取配置的nacos的名空间
        namespace: ywj-live-project
  config:
    import:
      - optional:nacos:ywj-live-im-core-server.yaml?group=DEFAULT_GROUP

